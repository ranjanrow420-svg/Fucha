<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: white; padding: 1rem; text-align: center; }
        .product { display: flex; justify-content: center; padding: 2rem; }
        .product img { max-width: 300px; }
        .details { margin-left: 2rem; }
        button { background: #4CAF50; color: white; padding: 0.5rem; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Store</h1>
        <nav><a href="#">Home</a> | <a href="#">Products</a> | <a href="#">Cart</a></nav>
    </header>
    <section class="product">
        <img src="product-image.jpg" alt="Product Image">
        <div class="details">
            <h2>Product Name</h2>
            <p>Description: This is a great product.</p>
            <p>Price: $29.99</p>
            <button>Add to Cart</button>
        </div>
    </section>
    <footer style="text-align: center; padding: 1rem; background: #f4f4f4;">
        <p>&copy; 2023 My Store. All rights reserved.</p>
    </footer>
</body>
</html>
